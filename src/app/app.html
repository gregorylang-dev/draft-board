<div class="min-h-screen flex flex-col">
  <!-- Navigation Rail / Top Bar -->
  <nav class="bg-zinc-950 border-b border-zinc-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-8">
      <div class="flex items-center gap-2">
        <mat-icon class="text-emerald-400">sports_football</mat-icon>
        <span class="font-serif font-bold text-xl tracking-tight text-white">DraftMaster</span>
      </div>
      
      <div class="flex items-center gap-1">
        <a routerLink="/draft-room" routerLinkActive="bg-zinc-900 text-emerald-400" class="px-4 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:text-white transition-all flex items-center gap-2">
          <mat-icon class="text-lg">edit_calendar</mat-icon>
          Draft Room
        </a>
        <a routerLink="/" routerLinkActive="bg-zinc-900 text-emerald-400" [routerLinkActiveOptions]="{exact: true}" class="px-4 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:text-white transition-all flex items-center gap-2">
          <mat-icon class="text-lg">grid_view</mat-icon>
          Big Board
        </a>
      </div>
    </div>

    <div class="hidden md:flex items-center gap-6">
      <button (click)="onReset()" class="text-xs font-mono text-red-400/60 hover:text-red-400 uppercase tracking-widest transition-colors flex items-center gap-2">
        <mat-icon class="text-sm">refresh</mat-icon>
        Reset Draft
      </button>
      <div class="h-4 w-px bg-zinc-800"></div>
      <div class="flex items-center gap-4 text-xs font-mono text-zinc-500 uppercase tracking-widest">
        @if (isSynced()) {
          Live Multi-Sync
          <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" title="Connected to Firebase Real-time Database"></div>
        } @else {
          Live Session
          <div class="w-2 h-2 rounded-full bg-emerald-500/50"></div>
        }
      </div>

      <!-- Google Authentication Section -->
      <div class="h-4 w-px bg-zinc-800"></div>
      @if (currentUser(); as user) {
        <div class="flex items-center gap-2.5 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-full">
          @if (user.photoURL) {
            <img [src]="user.photoURL" alt="User avatar" class="w-5 h-5 rounded-full border border-zinc-700 object-cover" />
          } @else {
            <mat-icon class="text-zinc-400 text-sm">account_circle</mat-icon>
          }
          <span class="text-xs font-medium text-zinc-200 max-w-[110px] truncate">{{ user.displayName || user.email }}</span>
          <button (click)="onLogout()" title="Sign Out" class="text-zinc-500 hover:text-red-400 transition-colors flex items-center ml-1">
            <mat-icon class="text-sm">logout</mat-icon>
          </button>
        </div>
      } @else {
        <button (click)="onGoogleSignIn()" class="px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 hover:border-zinc-700 rounded-lg text-xs font-medium text-zinc-200 transition-all flex items-center gap-2">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.3-.8-.4-1.8-.4-2.8s.1-2 .4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
          </svg>
          Google Sign In
        </button>
      }
    </div>
  </nav>

  <!-- Main Content Area -->
  <div class="flex-1 bg-zinc-950">
    <router-outlet></router-outlet>
  </div>
</div>
